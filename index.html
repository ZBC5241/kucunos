<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- V11.4 正式版：基于 V11.2 正式上线前端基线，仅升级登录模块，业务搜索/库存/补货/调拨逻辑保持不变 -->
<title>李家村库存工作台 V11.4 正式版</title>
  <meta name="description" content="李家村库存工作台 V11.4 正式版：保留全品类库存查询、本店库存、补货、调拨能力，增加登录保护与可配置登录状态。">
  <!-- V11.0 production | 默认页: 查库存 | 主题: 雾紫专业 | 响应式: 手机/平板/桌面
  后台对接字段契约: code=SKU主键; name=完整SKU全称; wh=门店/仓库; cat=分类; q=账面库存; a=可售库存;
  series/model/mem/color=搜索辅助; demo=演示机标记; hw=辅助字段。
  关键约束: 可售库存严格使用 a，a=0 不得回退 q；name 不得改简称；后台接入优先替换数据源，不要重写已审计搜索算法。 -->
  <style>
    *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif; }
    :root{
      --v1:#7c3aed; --v2:#a855f7; --green:#22c55e; --orange:#f59e0b;
      --bg:#f6f7fb; --ink:#1f2233; --sub:#8a90ab; --line:#eef0f6; --card:#fff;
    }
    body{ background:var(--bg); color:var(--ink); padding:14px 12px 60px; display:flex; justify-content:center; }
    .app{ width:100%; max-width:560px; }

    /* 顶栏 */
    .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .brand{ display:flex; align-items:center; gap:10px; }
    .logo{ width:42px; height:42px; border-radius:11px; background:linear-gradient(135deg,var(--v1),var(--v2));
           color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center;
           box-shadow:0 4px 12px rgba(124,58,237,.35); letter-spacing:-1px; }
    .brand .t1{ font-size:17px; font-weight:800; }
    .brand .t2{ font-size:11px; color:var(--sub); margin-top:1px; }
    .updated{ font-size:11px; color:var(--sub); background:#fff; border:1px solid var(--line);
              padding:5px 10px; border-radius:20px; white-space:nowrap; }
    .updated b{ color:var(--v1); font-weight:700; }

    /* 搜索框 */
    .search-box{ display:flex; align-items:center; gap:8px; background:#fff; border:2px solid var(--line);
                 border-radius:16px; padding:13px 14px; transition:.18s; box-shadow:0 2px 10px rgba(31,34,51,.04);
                 margin-bottom:18px; }
    .search-box:focus-within{ border-color:var(--v1); box-shadow:0 4px 16px rgba(124,58,237,.16); }
    .search-box .ico{ font-size:18px; }
    .search-box input{ flex:1; border:none; outline:none; font-size:17px; background:transparent; color:var(--ink); }
    .search-box input::placeholder{ color:#b8bdd0; }
    .search-box .clr{ width:22px; height:22px; border-radius:50%; background:#eef0f6; color:#8a90ab;
                      border:none; font-size:12px; display:none; align-items:center; justify-content:center; cursor:pointer; }
    .search-box.has .clr{ display:flex; }

    /* 意图条（紧凑） */
    .intent{ margin-top:18px; font-size:13px; color:var(--sub); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .intent b{ color:var(--ink); font-weight:700; }
    .intent .demo-toggle{ margin-left:auto; font-size:12px; color:var(--sub); background:#fff;
                          border:1px solid var(--line); padding:4px 9px; border-radius:14px; cursor:pointer; }
    .intent .demo-toggle b{ color:var(--orange); }

    /* 精简"还想看"链接（只在有多型号/多内存时出现） */
    .also{ margin-top:12px; padding:8px 12px; background:#fff; border:1px dashed #e7e1f5;
           border-radius:10px; font-size:12.5px; color:var(--sub); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .also b{ color:var(--ink); font-weight:700; }
    .also-link{ color:var(--v1); background:none; border:1px solid #d9d0f0; padding:3px 9px;
                border-radius:14px; font-size:12.5px; cursor:pointer; font-weight:600; }
    .also-link:active{ transform:scale(.96); }
    .also-link.on{ background:linear-gradient(135deg,var(--v1),var(--v2)); color:#fff; border-color:transparent; }

    /* 卡片 */
    .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px;
           margin-top:9px; animation:fade .35s cubic-bezier(.22,1,.36,1) both; }
    @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
    .card-h{ display:flex; align-items:center; gap:8px; }
    .code{ font-size:11px; color:var(--v1); background:#f3effe; padding:2px 8px; border-radius:6px;
           font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:600; }
    .demo{ font-size:11px; color:#d97706; background:#fef3c7; padding:2px 7px; border-radius:6px;
           font-weight:700; margin-left:auto; }
    .sku-name{ font-size:15px; font-weight:700; line-height:1.35; margin-top:7px; color:var(--ink); }
    .sku-name .c-meta{ color:var(--sub); font-weight:500; font-size:13px; margin-left:4px; }
    .card-f{ display:flex; align-items:flex-end; justify-content:space-between; margin-top:9px; }
    .wh{ font-size:13px; color:var(--sub); }
    .wh b{ color:#4b5168; font-weight:600; }
    .nums{ display:flex; gap:14px; }
    .nums.single{ flex:1; justify-content:flex-end; }
    .num{ text-align:right; }
    .num b{ font-size:24px; font-weight:800; color:var(--green); line-height:1; }
    .num i{ display:block; font-size:10px; color:var(--sub); font-style:normal; margin-top:3px; }

    /* 演示机段（默认折叠） */
    .demo-sec{ margin-top:18px; padding:0 4px 0; }
    .demo-sec .sec-h{ font-size:13px; color:var(--orange); font-weight:800; padding:8px 4px;
                      display:flex; align-items:center; gap:6px; border-top:1px dashed #f3e8d0; margin-top:14px; }
    .demo-sec .sec-h .cnt{ font-size:11px; color:var(--sub); font-weight:600; }

    /* 空 */
    .empty{ text-align:center; padding:56px 20px; color:var(--sub); }
    .empty .e1{ font-size:40px; margin-bottom:10px; }
    .empty .e2{ font-size:15px; }
    .empty b{ color:var(--ink); }
    .tip{ margin-top:18px; font-size:12px; color:#b8bdd0; text-align:center; line-height:1.7; }

    @media (max-width:480px){
      .brand .t1{ font-size:16px; } .sku-name{ font-size:14px; } .num b{ font-size:22px; }
    }
  </style>

<style id="v54-style">
:root{
  --v55-bg:#f4f5f8;--v55-card:#fff;--v55-ink:#171923;--v55-sub:#7b8196;--v55-muted:#a7acbb;
  --v55-line:#e8eaf0;--v55-purple:#6657d9;--v55-purple-soft:#f0edff;--v55-green:#1da675;
  --v55-red:#df4d4d;--v55-red-soft:#fff1f1;--v55-amber:#d98b19;--v55-amber-soft:#fff6e6;
  --v55-blue:#3f76da;--v55-shadow:0 6px 24px rgba(31,35,55,.055);
}
*{-webkit-tap-highlight-color:transparent}
body{background:var(--v55-bg)!important;color:var(--v55-ink);padding-bottom:88px!important}
body.v55-mode{display:block!important;padding:0 0 88px!important;background:var(--v55-bg)!important}
#v54Page{display:none;width:100%;max-width:600px;margin:0 auto;padding:0 12px 96px}
body.v55-mode #v54Page{display:block}
body.v55-mode #queryPage{display:none!important}

/* 统一查询页 */
#queryPage{width:100%;max-width:600px!important;padding:14px 12px 96px!important;margin:0 auto}
#queryPage .topbar{margin-bottom:12px;padding:2px 1px 0}
#queryPage .logo{width:38px;height:38px;border-radius:12px;background:var(--v55-ink);box-shadow:none;font-size:11px;letter-spacing:0}
#queryPage .brand .t1{font-size:18px;letter-spacing:-.25px}
#queryPage .brand .t2{font-size:11px;color:var(--v55-sub)}
#queryPage .updated{font-size:10.5px;border-color:var(--v55-line);color:var(--v55-sub);padding:6px 9px;background:#fff}
#queryPage .updated b{color:var(--v55-purple)}
#queryPage .search-box{border:1px solid var(--v55-line);border-radius:16px;padding:13px 14px;box-shadow:var(--v55-shadow);margin:10px 0 12px}
#queryPage .search-box:focus-within{border-color:#b9b1ef;box-shadow:0 6px 22px rgba(102,87,217,.10)}
#queryPage .search-box input{font-size:15px}
#queryPage .intent{margin-top:12px}
#queryPage .card{border:1px solid var(--v55-line);border-radius:16px;box-shadow:none;padding:13px 14px;margin-top:9px}
#queryPage .sku-name{font-size:14px;line-height:1.5}
#queryPage .num b{color:var(--v55-green)}
#queryPage .tip{color:var(--v55-muted)}

/* 顶部 */
.v55-top{position:sticky;top:0;z-index:30;background:rgba(244,245,248,.94);backdrop-filter:blur(16px);padding:13px 2px 9px}
.v55-topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.v55-title{font-size:19px;font-weight:850;letter-spacing:-.35px}
.v55-sub{font-size:10.8px;color:var(--v55-sub);margin-top:3px;line-height:1.35}
.v55-top-actions{display:flex;align-items:center;gap:6px}
.v55-pill,.v55-iconbtn{border:1px solid var(--v55-line);background:#fff;color:#666d81;border-radius:999px;padding:6px 9px;font-size:10.8px;font-weight:750;white-space:nowrap}
.v55-iconbtn{width:31px;height:31px;padding:0;display:grid;place-items:center;font-size:14px}
.v55-live{display:inline-flex;align-items:center;gap:5px;color:#5e6578}
.v55-live i{width:7px;height:7px;border-radius:50%;background:var(--v55-green);box-shadow:0 0 0 3px #e5f7f0}

/* 通用区块 */
.v55-section{background:var(--v55-card);border:1px solid var(--v55-line);border-radius:18px;margin-top:10px;padding:14px;box-shadow:var(--v55-shadow)}
.v55-sec-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:11px}
.v55-sec-title{font-size:14.5px;font-weight:850;letter-spacing:-.15px}
.v55-sec-sub{font-size:10.5px;color:var(--v55-sub);margin-top:3px;line-height:1.4}
.v55-link{border:0;background:none;color:var(--v55-purple);font-size:11px;font-weight:800;padding:2px 0}
.v55-divider{height:1px;background:var(--v55-line);margin:12px 0}
.v55-empty{text-align:center;padding:30px 12px;color:var(--v55-sub);font-size:12px;line-height:1.7}

/* 首页 */
.v55-summary{background:#191b24;color:#fff;border-radius:20px;padding:17px;margin-top:5px;box-shadow:0 10px 24px rgba(25,27,36,.13)}
.v55-summary-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.v55-summary .eyebrow{font-size:10.5px;color:#b9bdc9}
.v55-big{font-size:29px;font-weight:900;line-height:1;margin-top:6px;letter-spacing:-1px}
.v55-big small{font-size:12px;font-weight:700;color:#c8ccd5;margin-left:4px;letter-spacing:0}
.v55-summary-copy{font-size:11px;color:#b8bdc8;line-height:1.55;margin-top:8px;max-width:330px}
.v55-progress-ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#8a7af0 var(--donePct),#30333e 0);position:relative;flex:none}
.v55-progress-ring:after{content:"";position:absolute;width:44px;height:44px;border-radius:50%;background:#191b24}
.v55-progress-ring b{position:relative;z-index:1;font-size:13px}.v55-progress-ring span{position:relative;z-index:1;font-size:8px;color:#aeb3c1;display:block;text-align:center;margin-top:-2px}
.v55-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.v55-kpi{background:#262934;border:1px solid #313440;border-radius:12px;padding:9px 5px;text-align:center;cursor:pointer}
.v55-kpi b{display:block;font-size:17px}.v55-kpi span{display:block;font-size:9px;color:#aeb3c1;margin-top:4px}
.v55-kpi.red b{color:#ff8585}.v55-kpi.amber b{color:#ffc56d}.v55-kpi.green b{color:#70d9b0}.v55-kpi.purple b{color:#a99cf9}

.v55-priority{border-top:1px solid var(--v55-line);padding:12px 0;cursor:pointer}
.v55-priority:first-child{border-top:0;padding-top:1px}
.v55-rowtop{display:flex;align-items:flex-start;gap:8px}
.v55-badge{flex:none;border-radius:8px;padding:4px 7px;font-size:10px;font-weight:850;margin-top:1px}
.v55-badge.red{background:var(--v55-red-soft);color:var(--v55-red)}.v55-badge.amber{background:var(--v55-amber-soft);color:var(--v55-amber)}.v55-badge.green{background:#eaf8f3;color:var(--v55-green)}.v55-badge.purple{background:var(--v55-purple-soft);color:var(--v55-purple)}
.v55-name{font-size:13.5px;font-weight:820;line-height:1.48;word-break:break-word;flex:1}
.v55-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#969caf;font-size:9.8px;margin:5px 0 0}
.v55-quick{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:7px;margin-top:10px}
.v55-q{background:#f6f7fa;border-radius:10px;padding:8px 8px}.v55-q span{font-size:9px;color:var(--v55-sub);display:block}.v55-q b{font-size:14px;margin-top:2px;display:block}.v55-q.source b{font-size:11px;line-height:1.3;color:var(--v55-purple)}
.v55-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:9px}
.v55-btn{border:0;border-radius:10px;padding:8px 11px;font-size:11px;font-weight:850;cursor:pointer}
.v55-btn.primary{background:var(--v55-purple);color:#fff}.v55-btn.ghost{background:var(--v55-purple-soft);color:var(--v55-purple)}.v55-btn.neutral{background:#f0f1f5;color:#676e83}.v55-btn.danger{background:var(--v55-red-soft);color:var(--v55-red)}
.v55-btn:disabled{opacity:.48}

.v55-healthbar{height:9px;border-radius:999px;background:#eee;display:flex;overflow:hidden}.v55-healthbar i{height:100%}
.v55-legend{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}.v55-leg{text-align:center;font-size:9.5px;color:var(--v55-sub)}.v55-leg b{display:block;font-size:14px;color:var(--v55-ink);margin-top:2px}.v55-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px}

.v55-transfer-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.v55-transfer-stat div{background:#f7f8fa;border-radius:11px;padding:10px 7px;text-align:center}.v55-transfer-stat b{display:block;font-size:17px}.v55-transfer-stat span{display:block;font-size:9px;color:var(--v55-sub);margin-top:3px}

/* 筛选和任务 */
.v55-search{display:flex;gap:7px;margin:6px 0 9px}.v55-search input{flex:1;border:1px solid var(--v55-line);border-radius:13px;background:#fff;padding:11px 12px;font-size:13px;outline:0;box-shadow:0 2px 8px rgba(40,45,70,.025)}.v55-search input:focus{border-color:#bdb5ef}
.v55-filterbar{display:flex;gap:7px;overflow:auto;scrollbar-width:none;margin:2px 0 10px;padding-bottom:1px}.v55-chip{flex:none;border:1px solid var(--v55-line);background:#fff;color:#6e7489;border-radius:999px;padding:6px 10px;font-size:10.8px}.v55-chip.on{background:var(--v55-purple-soft);border-color:#d6cff6;color:var(--v55-purple);font-weight:850}
.v55-task{background:#fff;border:1px solid var(--v55-line);border-radius:16px;padding:12px;margin-top:9px}
.v55-task-head{display:flex;align-items:flex-start;gap:8px}
.v55-task-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.v55-metric{background:#f6f7fa;border-radius:9px;padding:8px 6px;text-align:center}.v55-metric span{display:block;font-size:9px;color:var(--v55-sub)}.v55-metric b{display:block;font-size:14px;margin-top:2px}
.v55-reco{margin-top:9px;background:#f6f3ff;border:1px solid #ebe6ff;border-radius:11px;padding:9px 10px;display:flex;align-items:center;gap:8px}.v55-reco .copy{flex:1}.v55-reco span{display:block;font-size:9px;color:#837b9d}.v55-reco b{display:block;font-size:11.5px;color:#5d50bd;margin-top:2px}.v55-reco strong{font-size:14px;color:var(--v55-purple)}
.v55-state{font-size:9.5px;color:#767d92;background:#f1f2f5;border-radius:999px;padding:4px 7px;white-space:nowrap}.v55-state.contact{background:#edf4ff;color:#4771ba}.v55-state.confirm{background:#ecf9f4;color:#17805c}.v55-state.done{background:#e8f7f1;color:#157455}


/* V5.6 本店库存全景 */
.v56-store-overview{background:linear-gradient(145deg,#ffffff,#fafafe);border:1px solid var(--v55-line);border-radius:19px;padding:14px;margin-top:5px;box-shadow:var(--v55-shadow)}
.v56-store-overview .label{font-size:10px;color:var(--v55-sub)}
.v56-store-total{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:4px}
.v56-store-total b{font-size:30px;line-height:1;font-weight:900;letter-spacing:-1px}
.v56-store-total b small{font-size:11px;font-weight:700;color:var(--v55-sub);letter-spacing:0;margin-left:4px}
.v56-store-total .hint{font-size:10px;color:var(--v55-sub);line-height:1.45;text-align:right}
.v56-store-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}
.v56-store-stat{background:#f5f6fa;border-radius:11px;padding:9px 7px;text-align:center}
.v56-store-stat b{display:block;font-size:16px}.v56-store-stat span{display:block;font-size:9px;color:var(--v55-sub);margin-top:3px}
.v56-home-rank{border-top:1px solid var(--v55-line);padding:9px 0;display:flex;align-items:center;gap:8px;cursor:pointer}
.v56-home-rank:first-child{border-top:0;padding-top:1px}
.v56-rank-no{width:23px;height:23px;border-radius:8px;background:#f0edff;color:var(--v55-purple);font-size:10px;font-weight:900;display:grid;place-items:center;flex:none}
.v56-home-rank .name{font-size:11.5px;line-height:1.42;font-weight:780;flex:1;min-width:0}
.v56-home-rank .qty{text-align:right;flex:none}.v56-home-rank .qty b{display:block;font-size:16px}.v56-home-rank .qty span{display:block;font-size:8px;color:var(--v55-sub);margin-top:1px}
.v56-catbar{display:flex;gap:7px;overflow:auto;scrollbar-width:none;margin:7px 0 9px;padding-bottom:1px}
.v56-cat{flex:none;border:1px solid var(--v55-line);background:#fff;border-radius:12px;padding:7px 9px;min-width:70px;text-align:left;color:#656c80}
.v56-cat.on{background:#f1eeff;border-color:#d8d1fa;color:#5d50c5}
.v56-cat b{display:block;font-size:11px}.v56-cat span{display:block;font-size:8.5px;color:var(--v55-sub);margin-top:2px}
.v56-sort{display:flex;background:#e9ebf1;border-radius:12px;padding:3px;margin:7px 0 9px}
.v56-sort button{flex:1;border:0;background:transparent;padding:8px 5px;border-radius:9px;font-size:10.5px;color:#7d8396}
.v56-sort button.on{background:#fff;color:var(--v55-ink);font-weight:850;box-shadow:0 2px 7px rgba(60,65,90,.07)}
.v56-stock-row{border-top:1px solid var(--v55-line);padding:12px 0;cursor:pointer}
.v56-stock-row:first-child{border-top:0;padding-top:1px}
.v56-stock-main{display:flex;align-items:flex-start;gap:8px}
.v56-stock-rank{width:25px;height:25px;border-radius:8px;background:#f3f4f7;color:#72798e;display:grid;place-items:center;font-size:10px;font-weight:900;flex:none;margin-top:1px}
.v56-stock-copy{flex:1;min-width:0}.v56-stock-name{font-size:12.5px;font-weight:820;line-height:1.48;word-break:break-word}
.v56-stock-meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;color:#9aa0b1;margin-top:4px}

 const ss=supportStores(),groups=groupCart(),activeCount=Object.values(cart).filter(c=>c.state!=='done').length,doneCount=Object.values(cart).filter(c=>c.state==='done').length;
 page.innerHTML=top('调拨中心','按货源门店归组，一次联系一家店，完成一批 SKU')+
 `<div class="v55-seg"><button class="${supplyMode==='pool'?'on':''}" data-sm="pool">货源推荐</button><button class="${supplyMode==='cart'?'on':''}" data-sm="cart">今日调拨单 ${Object.keys(cart).length?`(${Object.keys(cart).length})`:''}</button></div>`+
 (supplyMode==='pool'?`<section class="v55-section"><div class="v55-sec-head"><div><div class="v55-sec-title">今天先联系谁</div><div class="v55-sec-sub">优先能一次解决更多李家村缺口、且库存更深的门店</div></div></div>${ss.map((s,i)=>`<div class="v55-store" data-store="${esc(s.store)}"><div class="v55-store-top"><div class="v55-rank">${i+1}</div><div class="v55-store-name">${esc(shortStore(s.store))}</div><div class="v55-store-score"><b>${s.items.length}</b><span>可支援SKU</span></div></div><div class="v55-store-sub">匹配库存 ${s.qty} · 库存较深 ${s.deep} 款</div></div>`).join('')||'<div class="v55-empty">暂无可支援门店</div>'}</section>`:
 `${groups.length?groups.map(g=>transferGroup(g)).join(''):'<section class="v55-section v55-empty">还没有调拨任务。可从“补货”页一键加入，或从“货源推荐”按门店选择。</section>'}<section class="v55-section"><div class="v55-sec-head"><div><div class="v55-sec-title">调拨状态</div><div class="v55-sec-sub">当前 ${activeCount} 款进行中；完成后会同步从首页待办中移出</div></div>${doneCount?'<button class="v55-link" id="clearDone">清理已完成</button>':''}</div></section>`);
 bindTop();
 page.querySelectorAll('[data-sm]').forEach(b=>b.onclick=()=>{supplyMode=b.dataset.sm;renderSupply()});
 page.querySelectorAll('[data-store]').forEach(b=>b.onclick=()=>openStore(b.dataset.store));
 page.querySelectorAll('[data-copy-store]').forEach(b=>b.onclick=()=>copyStoreList(b.dataset.copyStore,b));
 page.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>advanceState(b.dataset.next));
 page.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.minus,-1));page.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.plus,1));
 page.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{delete cart[b.dataset.remove];if(taskState[b.dataset.remove]!=='done')delete taskState[b.dataset.remove];saveAll();renderSupply()});
 const cd=document.getElementById('clearDone');if(cd)cd.onclick=()=>{for(const [k,c] of Object.entries(cart))if(c.state==='done')delete cart[k];saveAll();renderSupply()};
}
function transferGroup(g){
 const open=g.items.filter(z=>z.c.state!=='done').length,confirmed=g.items.filter(z=>z.c.state==='confirmed'||z.c.state==='done').length;
 return `<div class="v55-group"><div class="v55-group-head"><div class="copy"><div class="v55-group-title">${esc(shortStore(g.store))}</div><div class="v55-group-sub">${g.items.length} 个 SKU · ${open} 个进行中 · ${confirmed} 个已确认/完成</div></div><div style="display:flex;gap:6px"><button class="v55-btn neutral" data-copy-store="${esc(g.store)}">复制清单</button><button class="v55-btn ghost" data-store="${esc(g.store)}">查看货源</button></div></div>${g.items.map(({c,x})=>`<div class="v55-group-item"><div class="v55-rowtop"><div class="v55-name">${esc(x.name)}</div><span class="v55-state ${stateClass(c.state)}">${stateLabel(c.state)}</span></div><div class="v55-cart-meta">${esc(x.code)} · 李家村 ${x.own} · 对方库存 ${x.by.get(c.store)||0} · 建议补 ${x.suggest}</div><div class="v55-actions" style="justify-content:space-between;align-items:center"><div class="v55-qty"><button data-minus="${esc(x.code)}">−</button><b>${c.qty||1}</b><button data-plus="${esc(x.code)}">+</button></div><div style="display:flex;gap:6px"><button class="v55-btn neutral" data-remove="${esc(x.code)}">移除</button><button class="v55-btn primary" data-next="${esc(x.code)}">${c.state==='selected'?'标记已联系':c.state==='contacted'?'确认可调':c.state==='confirmed'?'完成入库':'已完成'}</button></div></div></div>`).join('')}</div>`;
}
function copyStoreList(store,btn){
 const g=groupCart().find(x=>x.store===store);if(!g)return;
 const lines=[`${shortStore(store)} 调货清单`,''];
 for(const {c,x} of g.items.filter(z=>z.c.state!=='done'))lines.push(`${x.name} × ${c.qty||1}`);
 lines.push('',`共 ${g.items.filter(z=>z.c.state!=='done').length} 个 SKU`);
 const text=lines.join('\\n');
 const done=()=>{if(btn){const old=btn.textContent;btn.textContent='已复制';setTimeout(()=>btn.textContent=old,1200)}};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));else fallbackCopy(text,done);
}
function fallbackCopy(text,done){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}ta.remove()}
function addBest(code){
 const x=byCode.get(code);if(!x)return;if(cart[code]){supplyMode='cart';switchTab('supply');return}const d=bestDonor(x);if(!d){openSku(code);return}
 const qty=Math.max(1,Math.min(x.suggest||1,d.a));cart[code]={code,store:d.store,qty,state:'selected'};taskState[code]='selected';saveAll();render();
}
function addFromStore(code,store){const x=byCode.get(code);if(!x)return;const stock=x.by.get(store)||0;if(!stock)return;cart[code]={code,store,qty:Math.max(1,Math.min(x.suggest||1,stock)),state:'selected'};taskState[code]='selected';saveAll()}
function advanceState(code){const c=cart[code];if(!c)return;if(c.state==='selected')c.state='contacted';else if(c.state==='contacted')c.state='confirmed';else if(c.state==='confirmed')c.state='done';else return;taskState[code]=c.state;saveAll();renderSupply()}
function changeQty(code,delta){const c=cart[code],x=byCode.get(code);if(!c||!x)return;const max=Math.max(1,x.by.get(c.store)||1);c.qty=Math.max(1,Math.min(max,(c.qty||1)+delta));saveAll();renderSupply()}
function openSku(code){
 const x=byCode.get(code);if(!x)return;const all=STORES.map(s=>({store:s,a:x.by.get(s)||0})).sort((a,b)=>b.a-a.a),max=Math.max(1,...all.map(d=>d.a));
 sheetBody.innerHTML=`<div class="v55-sheet-head"><h3>${esc(x.name)}</h3><button class="v55-x" id="v55Close">×</button></div><div class="v55-code">${esc(x.code)} · ${esc(x.cat)}</div>${x.nameConflict?`<div class="v55-warning">⚠ 同一商品编码存在 ${x.nameVariants.length} 个名称版本。当前显示使用出现次数最多、同次数时更完整的名称；调货前建议核对商品档案。</div>`:''}<div class="v55-sheet-card"><div class="v55-sheet-grid"><div class="v55-sheet-stat"><span>李家村可用</span><b>${x.own}</b></div><div class="v55-sheet-stat"><span>参考水位</span><b>${x.ref}</b></div><div class="v55-sheet-stat"><span>建议补</span><b>${x.suggest}</b></div></div></div><div class="v55-sheet-card"><div class="v55-sec-title">17店库存分布</div><div class="v55-sec-sub">库存高的门店优先；本店单独标记</div>${all.map((d,i)=>`<div class="v55-donor"><div class="v55-donor-top"><div class="v55-donor-name">${d.store===HOME?'📍 李家村（本店）':(i<3&&d.a>0?'★ ':'')+esc(shortStore(d.store))}</div><div class="v55-donor-qty" style="${d.a===0?'color:#b7bbc7':''}">${d.a}</div></div><div class="v55-donor-bar"><i style="width:${Math.round(d.a/max*100)}%;${d.store===HOME?'background:#6657d9':''}"></i></div>${d.store!==HOME&&d.a>0&&(x.status==='out'||x.status==='low')&&stateOf(x.code)!=='done'?`<div class="v55-donor-actions"><button class="v55-btn primary" data-cart="${esc(d.store)}">从这家调货</button></div>`:''}</div>`).join('')}</div>`;
 document.getElementById('v55Close').onclick=closeSheet;sheetBody.querySelectorAll('[data-cart]').forEach(b=>b.onclick=()=>{addFromStore(x.code,b.dataset.cart);closeSheet();supplyMode='cart';switchTab('supply')});sheet.classList.add('show');
}
function openStore(store){
 const ss=supportStores().find(x=>x.store===store),existing=groupCart().find(x=>x.store===store),merged=new Map();
 for(const z of (ss?.items||[]))merged.set(z.x.code,z);
 for(const z of (existing?.items||[]))merged.set(z.x.code,{x:z.x,a:z.x.by.get(store)||0});
 const items=[...merged.values()];
 sheetBody.innerHTML=`<div class="v55-sheet-head"><h3>${esc(shortStore(store))} · 可支援李家村</h3><button class="v55-x" id="v55Close">×</button></div><div class="v55-code">${items.length} 个相关 SKU</div><div class="v55-sheet-card">${items.sort((a,b)=>b.x.priority-a.x.priority).map(({x,a})=>`<div class="v55-donor"><div class="v55-name" style="font-size:12.5px">${esc(x.name)}</div><div class="v55-code">${esc(x.code)}</div><div class="v55-donor-top" style="margin-top:7px"><div class="v55-donor-name">李家村 ${x.own} · 建议补 ${x.suggest}</div><div class="v55-donor-qty">${a}</div></div><div class="v55-donor-actions"><button class="v55-btn primary" data-sc="${esc(x.code)}" ${cart[x.code]?'disabled':''}>${cart[x.code]?'已在调拨单':'加入调拨单'}</button></div></div>`).join('')||'<div class="v55-empty">暂无可支援 SKU</div>'}</div>`;
 document.getElementById('v55Close').onclick=closeSheet;sheetBody.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{addFromStore(b.dataset.sc,store);b.textContent='已加入';b.disabled=true});sheet.classList.add('show');
}
function openRule(){
 const conflicts=scoped().filter(x=>x.nameConflict).length;
 sheetBody.innerHTML=`<div class="v55-sheet-head"><h3>当前库存判断规则</h3><button class="v55-x" id="v55Close">×</button></div><div class="v55-sheet-card v55-rule"><b>SKU 主键</b><br>每个商品按商品编码独立计算，不跨颜色、不跨容量合并。<div class="v55-divider"></div><b>参考水位</b><br>同一 SKU 在17店“有货门店”的可用库存中位数，向上取整。<div class="v55-divider"></div><b>状态判断</b><br>李家村库存为 0 = 无货；低于参考水位约 60% = 低水位；高于参考水位约 160% 且至少高 2 件 = 偏高。<div class="v55-divider"></div><b>当前边界</b><br>这是基于现存量分布的前端参考模型，尚未接入销量、在途、周转天数和活动计划，因此不等同于正式安全库存模型。</div>${conflicts?`<div class="v55-warning">当前范围检测到 ${conflicts} 个商品编码存在多个名称版本。系统会提示档案异常，不建议无提示自动合并。</div>`:''}`;
 document.getElementById('v55Close').onclick=closeSheet;sheet.classList.add('show');
}
function closeSheet(){sheet.classList.remove('show')}sheet.onclick=e=>{if(e.target===sheet)closeSheet()};
function render(){if(tab==='home')renderHome();else if(tab==='store')renderStore();else if(tab==='restock')renderRestock();else if(tab==='supply')renderSupply()}
function switchTab(t){
 tab=t;document.querySelectorAll('#v54Nav button').forEach(b=>b.classList.toggle('on',b.dataset.v55===t));
 if(t==='query'){document.body.classList.remove('v55-mode');query.style.display='';page.style.display='none';window.scrollTo({top:0,behavior:'auto'})}
 else{document.body.classList.add('v55-mode');query.style.display='none';page.style.display='block';render();window.scrollTo({top:0,behavior:'auto'})}
 updateBadges();
}
document.querySelectorAll('#v54Nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.v55));
window.__v55={SKU,switchTab,openSku,renderStore,renderRestock,cart,taskState,resolveStoreSearch,buildStoreFilteredView,updateStoreSearchView,resolveRestockSearch,updateRestockSearchView};
window.LJC_RUNTIME_INFO={version:'11.4',get skuCount(){return SKU.length},get coreSkuCount(){return SKU.filter(x=>CORE.has(x.cat)).length},get stores(){return [...STORES]},get home(){return HOME}};
updateBadges();switchTab('query');
})();
</script>

<script id="v111-auth-script">
(()=>{
const AUTH_KEY='ljc-auth-v114';
const AUTH_VERSION='11.4';
const ACCOUNTS={'zbc':{role:'admin'},'xzy':{role:'staff'}};
const PASS_SHA256='6b86b273ff34fce19d6b804eff5a3f5747ada4eaa22f1d49c01e52ddb7875b4b';
const SESSION_MS=24*60*60*1000;
const form=document.getElementById('v111LoginForm'),user=document.getElementById('v111User'),pass=document.getElementById('v111Pass'),error=document.getElementById('v111LoginError'),logout=document.getElementById('v111Logout');

function signedIn(){return document.documentElement.classList.contains('ljc-authenticated')}
function desktopFocus(el){try{if(window.matchMedia('(pointer:fine)').matches) setTimeout(()=>el?.focus(),40)}catch(e){}}
function clearSession(){try{localStorage.removeItem(AUTH_KEY)}catch(e){}}
function readSession(){
  try{
    const v=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');
    if(v&&v.role&&v.version===AUTH_VERSION&&Number(v.expiresAt)>Date.now())return v;
  }catch(e){}
  clearSession();return null;
}
function showLogin(){
  document.documentElement.classList.remove('ljc-authenticated','ljc-role-admin','ljc-role-staff');
  if(pass)pass.value='';if(error)error.textContent='';
  desktopFocus(user);
}
function openWorkbench(role){
  document.documentElement.classList.add('ljc-authenticated');
  if(role)document.documentElement.classList.add('ljc-role-'+role);
  if(error)error.textContent='';
  if(typeof window.__v55?.switchTab==='function')window.__v55.switchTab('query');
  desktopFocus(document.getElementById('searchInput'));
}
function writeSession(u,role){
  const now=Date.now();
  try{localStorage.setItem(AUTH_KEY,JSON.stringify({user:u,role:role,version:AUTH_VERSION,signedAt:new Date(now).toISOString(),expiresAt:now+SESSION_MS}))}catch(e){}
}
async function sha256(text){
  if(window.crypto&&window.crypto.subtle&&window.TextEncoder){
    const buf=await window.crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  // Fallback for unusual local-file environments. This is only a compatibility fallback for the internal test layer.
  function rr(n,x){return (x>>>n)|(x<<(32-n))}
  const maxWord=Math.pow(2,32), words=[], ascii=unescape(encodeURIComponent(text));
  let result='', hash=sha256.h=sha256.h||[], k=sha256.k=sha256.k||[], primeCounter=k.length, isComposite={};
  for(let candidate=2;primeCounter<64;candidate++){if(!isComposite[candidate]){for(let i=0;i<313;i+=candidate)isComposite[i]=candidate;hash[primeCounter]=(Math.pow(candidate,.5)*maxWord)|0;k[primeCounter++]=(Math.pow(candidate,1/3)*maxWord)|0}}
  const lengthProperty='length', asciiBitLength=ascii[lengthProperty]*8;
  words[asciiBitLength>>5]|=0x80<<(24-asciiBitLength%32);words[((asciiBitLength+64>>9)<<4)+15]=asciiBitLength;
  for(let j=0;j<words[lengthProperty];){const w=words.slice(j,j+=16), oldHash=hash.slice(0);hash=hash.slice(0,8);for(let i=0;i<64;i++){const i2=i+j, w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];const temp1=hash[7]+(rr(6,e)^rr(11,e)^rr(25,e))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(7,w15)^rr(18,w15)^(w15>>>3))+w[i-7]+(rr(17,w2)^rr(19,w2)^(w2>>>10)))|0);const temp2=(rr(2,a)^rr(13,a)^rr(22,a))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));hash=[(temp1+temp2)|0].concat(hash);hash[4]=(hash[4]+temp1)|0;for(let i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0}}
  for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;result+=(b<16?'0':'')+b.toString(16)}return result;
}

let submitting=false;
form?.addEventListener('submit',async e=>{
  e.preventDefault();if(submitting)return;
  const u=user.value.trim();const p=pass.value;
  if(!u||!p){error.textContent='请输入账号和密码';return}
  submitting=true;const btn=form.querySelector('.v111-submit');if(btn){btn.disabled=true;btn.textContent='正在验证…'}
  try{
    const digest=await sha256(p);
    const acc=ACCOUNTS[u];
    if(acc&&digest===PASS_SHA256){writeSession(u,acc.role);pass.value='';openWorkbench(acc.role)}
    else{error.textContent='账号或密码错误，请重新输入';pass.value='';pass.focus()}
  }catch(err){error.textContent='当前浏览器无法完成登录验证，请换用 Chrome / Edge 重试'}
  finally{submitting=false;if(btn){btn.disabled=false;btn.textContent='登录工作台'}}
});
logout?.addEventListener('click',()=>{clearSession();showLogin()});
window.LJC_AUTH={version:AUTH_VERSION,isSignedIn:signedIn,expiresInDays:1,logout:()=>{clearSession();showLogin()}};
if(readSession())openWorkbench();else showLogin();
})();
</script>
